name: Delivery

on:
  push:
    branches: [assgn2-ms3-submission]
  workflow_dispatch:
    inputs:
      image:
        description: 'Existing ghcr.io/airbus-a330/ospsd-team-2@sha256:... (no rebuild)'
        required: true
        type: string
      target:
        description: Protected destination
        type: choice
        options: [disposable, production]
        default: disposable

permissions:
  contents: read

# Serialize releases AND rollback; never cancel a deployment halfway through.
# GitHub keeps one running and one pending run; newer pending runs can replace
# older pending runs. It is not a FIFO queue. See the delivery runbook.
concurrency:
  group: calendar-delivery
  cancel-in-progress: false

jobs:
  build-check:
    if: github.ref == 'refs/heads/assgn2-ms3-submission'
    uses: ./.github/workflows/build.yml
  format-check:
    if: github.ref == 'refs/heads/assgn2-ms3-submission'
    uses: ./.github/workflows/format.yml
  tests-check:
    if: github.ref == 'refs/heads/assgn2-ms3-submission'
    uses: ./.github/workflows/tests.yml
  infra-check:
    if: github.ref == 'refs/heads/assgn2-ms3-submission'
    uses: ./.github/workflows/infrastructure.yml

  artifact:
    needs: [build-check, format-check, tests-check, infra-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Select retained artifact (rollback or disposable exercise)
        if: github.event_name == 'workflow_dispatch'
        id: retained
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          [[ "$IMAGE" =~ ^ghcr\.io/airbus-a330/ospsd-team-2@sha256:[0-9a-f]{64}$ ]]
          python3 scripts/render_blueprint.py --image "$IMAGE" > /dev/null
          echo "ref=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Authenticate to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build once and test that image
        if: github.event_name == 'push'
        env:
          CONTAINER_IMAGE: ghcr.io/airbus-a330/ospsd-team-2:${{ github.sha }}
        run: |
          make container-build
          make container-check
      - name: Publish the tested image and resolve its digest
        if: github.event_name == 'push'
        id: published
        env:
          IMAGE: ghcr.io/airbus-a330/ospsd-team-2:${{ github.sha }}
        run: |
          docker push "$IMAGE"
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          [[ "$ref" =~ ^ghcr\.io/airbus-a330/ospsd-team-2@sha256:[0-9a-f]{64}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Record selected immutable artifact
        id: image
        env:
          PUBLISHED: ${{ steps.published.outputs.ref }}
          RETAINED: ${{ steps.retained.outputs.ref }}
        run: |
          echo "ref=${PUBLISHED:-$RETAINED}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.event_name == 'push' && 'production' || inputs.target }}
      url: ${{ vars.CALENDAR_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.17'
      - run: uv sync --locked
      - name: Deploy exact digest and require real-provider smoke plus cleanup
        env:
          IMAGE: ${{ needs.artifact.outputs.image }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          CALENDAR_BASE_URL: ${{ vars.CALENDAR_BASE_URL }}
          CALENDAR_API_TOKEN: ${{ secrets.CALENDAR_API_TOKEN }}
        run: uv run --locked python -m scripts.deploy_render --image "$IMAGE"
      - name: Retain evidence even when delivery fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            delivery.json
            delivery.yaml
          retention-days: 90
          if-no-files-found: error
