[project]
name = "ospsd-team-2-calendar-service"
version = "0.1.0"
description = "Backend calendar service for NYU's Open Source and Professional Software Development course."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.124.4",
    "google-api-python-client==2.201.0",
    "google-auth-httplib2==0.4.4",
    "google-auth-oauthlib==1.5.0",
    "pydantic==2.12.5",
    "uvicorn[standard]==0.42.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.15.9",
]

[tool.uv]
package = false
required-version = "==0.12.17"
